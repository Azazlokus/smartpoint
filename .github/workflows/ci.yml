name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3, redis, mbstring, xml, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      # ── Качество кода ──────────────────────────────────────────────────────

      - name: Pint — code style
        run: ./vendor/bin/pint --test

      - name: PHPStan — static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      # ── Тесты ─────────────────────────────────────────────────────────────

      - name: Run tests
        run: php artisan test --stop-on-failure
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
