# ── Input ─────────────────────────────────────────────────────────────────────
# Laravel шлёт JSON-строки по TCP через Monolog SocketHandler.
# codec => json_lines — каждая строка отдельный JSON-документ.
input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

# ── Filter ────────────────────────────────────────────────────────────────────
filter {

  # Переводим timestamp из Logstash-формата в @timestamp Elasticsearch
  if [datetime] {
    date {
      match   => ["datetime", "yyyy-MM-dd HH:mm:ss"]
      target  => "@timestamp"
      remove_field => ["datetime"]
    }
  }

  # Удаляем технические поля Monolog, которые не нужны в индексе
  mutate {
    remove_field => ["@version", "port", "host"]
  }
}

# ── Output ────────────────────────────────────────────────────────────────────
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Ежедневные индексы: smartpoint-2026.04.27
    index => "smartpoint-%{+YYYY.MM.dd}"
  }
}
